# Bastion configuration with permission rules: a default-allow gateway that
# explicitly blocks destructive filesystem operations.
#
# Run the gateway with:
#   bastion run --config examples/permissions/bastion.yaml
#
# Try it: a `read_*` or `list_*` call goes through, but `write_file`,
# `edit_file`, or `move_file` is blocked before reaching the upstream and
# recorded in `./bastion-audit.jsonl` with `outcome: denied` and the rule that
# fired in `error`.

upstreams:
  files:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

audit:
  enabled: true
  path: ./bastion-audit.jsonl

policy:
  # The default applies when no rule matches; specific rules below override it.
  default: allow

  # The most specific glob wins; ties break by definition order. So broader
  # `files_*` rules sit alongside narrower `files_delete_*` rules and the
  # delete rule wins for delete calls.
# Tool names here are NOT prefixed, because this config declares a single
# upstream. Bastion namespaces tools as <upstream>_<tool> only when several are
# configured — with one, the upstream's own names pass straight through. A rule
# written for the wrong form matches nothing and silently does nothing;
# `bastion doctor` reports any rule that matches no advertised tool.
  permissions:
    - { tool: "read_*",      action: allow }
    - { tool: "list_*",      action: allow }
    - { tool: "write_file",  action: deny  }
    - { tool: "edit_file",   action: deny  }
    - { tool: "move_file",   action: deny  }

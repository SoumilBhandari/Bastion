# Permissions example: start from deny-by-default, then open only the
# tool families your agent is allowed to use.
#
# Run the gateway with:
#   bastion run --config examples/permissions/bastion.yaml
#
# When multiple rules match, Bastion uses the most-specific rule.

upstreams:
  files:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
  search:
    url: https://search.example.com/mcp

policy:
  # Block any tool that is not explicitly allowed below.
  default: deny
  permissions:
    # Allow read-only filesystem operations.
    - tool: "files_read_*"
      action: allow

    # Allow search tools from the remote search upstream.
    - tool: "search_*"
      action: allow

    # Keep destructive filesystem tools blocked even if a broader files_*
    # allow rule is added later.
    - tool: "files_delete_*"
      action: deny
    - tool: "files_write_*"
      action: deny
